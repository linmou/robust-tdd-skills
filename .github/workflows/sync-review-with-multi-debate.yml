name: Sync review-with-multi-debate submodule

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-review-with-multi-debate
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout umbrella repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Sync review-with-multi-debate
        run: scripts/sync_review_with_multi_debate_submodule.sh

      - name: Commit updated pointer
        shell: bash
        run: |
          if git diff --quiet -- review-with-multi-debate; then
            echo "review-with-multi-debate already matches upstream main."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review-with-multi-debate
          git commit -m "Update review-with-multi-debate submodule"
          git push
